appId: com.sitemapanalyzer.app
productName: SpiderSEO
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  # ${arch} is required here. Both the x64 and arm64 DMGs are built in
  # parallel and each mounts a scratch volume named after this title, so
  # without the suffix they collide on /Volumes/<title> and the detach of the
  # second one fails with hdiutil exit code 16. Expands to "" for the default
  # arch and "-arm64" for the other, matching electron-builder's own default.
  title: ${productName} ${version}${arch}
publish:
  provider: github
  releaseType: release
